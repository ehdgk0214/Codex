# Required because the app depends on AndroidX libraries such as Compose, Activity, WorkManager, and DataStore.
android.useAndroidX=true

# Keeps generated R classes smaller and is the default recommendation for modern Android projects.
android.nonTransitiveRClass=true

# Use the official Kotlin style in Gradle builds and IDE imports.
kotlin.code.style=official

# CI stability: keep Gradle/Kotlin memory usage predictable on GitHub-hosted runners.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
